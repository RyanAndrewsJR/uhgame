<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champion Kit Board</title>
<style>
/* Layout concept: a war-table. Roster rail on the left, one champion's kit laid out as five cards, each with a to-scale top-down shape of the ability on a 1 m grid. */
/* No network requests: the fonts below are used when installed on this PC; otherwise the fallbacks in each stack apply. */
:root{
  --bg:#E9EDF1; --panel:#F6F8FA; --panel-2:#EDF1F5; --ink:#13202C; --ink-2:#506172; --line:#C9D3DD; --grid:#D8E0E8;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --heat:#C4472A; --magic:#6D55C9; --heal:#2B8A57; --warn:#A8620A;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B121A; --panel:#121B25; --panel-2:#18232F; --ink:#E5ECF2; --ink-2:#97A9BA; --line:#26364A; --grid:#1A2735;
  --accent:#43C5D0; --accent-ink:#06222A; --heat:#F07C5C; --magic:#A592FF; --heal:#5BCB8E; --warn:#E6A24C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B121A; --panel:#121B25; --panel-2:#18232F; --ink:#E5ECF2; --ink-2:#97A9BA; --line:#26364A; --grid:#1A2735;
  --accent:#43C5D0; --accent-ink:#06222A; --heat:#F07C5C; --magic:#A592FF; --heal:#5BCB8E; --warn:#E6A24C; color-scheme:dark; }
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:16px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}

/* roster */
.rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:10px;padding-top:4px}
@media (max-width:820px){.rail{position:static}}
.rail h2{font:600 13px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.roster{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.roster{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.chip{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
@media (max-width:820px){.chip{flex:0 0 170px}}
.chip b{font:600 19px/1.05 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font:400 11px/1.2 var(--f-mono);color:var(--ink-2)}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--heat);color:var(--heat)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font:400 11px/1.3 var(--f-mono);color:var(--ink-2)}
.status.off{color:var(--warn)}

/* champion header */
.head{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;margin-bottom:16px}
.head-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.name{flex:1 1 260px;min-width:0;font:700 clamp(30px,5vw,46px)/1 var(--f-display);letter-spacing:.01em;background:transparent;border:0;border-bottom:2px solid var(--line);padding:2px 0;width:100%}
.name:focus{border-bottom-color:var(--accent);outline:none}
.sel{display:flex;flex-direction:column;gap:3px;font:500 11px/1 var(--f-mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}
.sel select,.sel input{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:500 14px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink)}
.fantasy{width:100%;resize:vertical;min-height:44px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* kit */
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.slot{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:5px;background:var(--ink);color:var(--bg);font:700 22px/1 var(--f-display)}
.slot.p{background:transparent;border:1.5px solid var(--ink-2);color:var(--ink-2);font-size:16px}
.card-head input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;font:600 21px/1.1 var(--f-display);letter-spacing:.02em;padding:2px 0}
.card-head input:focus{border-bottom-color:var(--accent);outline:none}
.preview{position:relative;background:var(--panel-2);border-bottom:1px solid var(--line)}
.preview svg{display:block;width:100%;height:190px}
.preview .cap{position:absolute;left:10px;bottom:6px;font:400 10.5px/1.2 var(--f-mono);color:var(--ink-2)}
.preview .cap.r{left:auto;right:10px}
.preview .cap.tl{left:10px;top:8px;bottom:auto;font:500 12px/1.2 var(--f-mono);color:var(--ink)}
.tag.add{border-style:dashed}
.grp{flex-basis:100%;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.row.unused label,.row.unused input[type=number]{opacity:.5}
.row.unused input[type=range]{opacity:.45}
details.more{border:1px solid var(--line);border-radius:6px;padding:0 10px}
details.more summary{cursor:pointer;padding:7px 0;font:500 12px var(--f-mono);color:var(--ink-2)}
details.more[open]{padding-bottom:10px}
details.more .row{margin-top:8px}
.customtag{display:flex;gap:6px;flex-basis:100%;margin-top:6px}
.customtag input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:400 12px var(--f-mono)}
.body{padding:12px;display:grid;gap:11px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 64px;gap:8px;align-items:center}
.row label{font:500 12px/1.2 var(--f-body);color:var(--ink-2)}
.row input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.row input[type=number]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:400 12.5px var(--f-mono);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{font:400 11.5px/1.45 var(--f-mono);color:var(--ink-2);background:var(--panel-2);border-radius:5px;padding:6px 8px}
.read b{color:var(--ink);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 9px;font:400 11.5px var(--f-mono);color:var(--ink-2);cursor:pointer}
.tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.desc{width:100%;resize:vertical;min-height:74px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;font:500 11px/1 var(--f-mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}
.fld select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 7px;font:500 13px var(--f-body);text-transform:none;letter-spacing:0;width:100%}
.notes{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.notes textarea{width:100%;min-height:70px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h1{font:700 34px/1 var(--f-display);margin:0}
.empty p{max-width:46ch;color:var(--ink-2);margin:0}
.brief{margin-top:16px;display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.brief textarea{width:100%;min-height:200px;font:400 12px/1.5 var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px}
.banner{background:var(--panel-2);border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:7px 10px;margin-bottom:12px;font-size:13px}
/* v2: kinds, filters, archetype hints, races and the board panel */
.chip-top{display:flex;align-items:center;gap:6px;min-width:0}
.chip-top b{flex:1 1 auto;min-width:0}
.kind{flex:0 0 auto;font:500 9.5px/1 var(--f-mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:2px 4px;color:var(--ink-2)}
.kind.enemy{border-color:var(--heat);color:var(--heat)}
.filters{display:grid;gap:6px}
.filters select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:400 12px var(--f-body)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{flex:1 1 0;min-width:0;background:transparent;border:0;border-right:1px solid var(--line);padding:5px 6px;cursor:pointer;font:500 12px var(--f-body);color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.newrow{display:grid;gap:6px}
.muted{color:var(--ink-2);font:400 12px/1.4 var(--f-body);margin:0}
.hint{display:flex;gap:8px;align-items:center;font:400 12px/1.3 var(--f-mono);color:var(--ink-2)}
.hint input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0;font:400 12px var(--f-mono);color:var(--ink-2)}
.hint input:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.layer{width:100%;resize:vertical;min-height:38px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:14px}
.board h1{font:700 34px/1 var(--f-display);margin:0}
.board h3{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 0}
.board input,.board select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:400 13px var(--f-body);min-width:0;width:100%}
.race{display:grid;grid-template-columns:minmax(0,1.1fr) 92px 112px minmax(0,1.7fr) minmax(0,1.7fr) auto;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.race.head{border-top:0;padding-top:0;font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:980px){.race{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.race.head{display:none}}
.race .used{font:400 11px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.hints{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;align-items:center}
.hints label{font:500 12px var(--f-body);color:var(--ink-2)}
/* v2: compound casts (effects list and timeline) */
.fx{display:grid;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.fx:empty{display:none}
.fx-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:4px 5px}
.fx-row.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.fx-pick{flex:1 1 150px;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:7px;text-align:left;background:transparent;border:0;padding:2px;cursor:pointer}
.fx-pick b{grid-row:span 2;align-self:center;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 12px/1 var(--f-mono)}
.fx-pick span{font:500 12.5px/1.2 var(--f-body)}
.fx-pick small{font:400 10.5px/1.3 var(--f-mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-row select,.fx-row input{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:3px 4px;font:400 11.5px var(--f-mono)}
.fx-row input{width:58px;text-align:right}
.fx-start{font:400 11px var(--f-mono);color:var(--ink-2);padding:0 4px}
.fx-btn{background:transparent;border:1px solid var(--line);border-radius:4px;min-width:26px;height:24px;padding:0 5px;cursor:pointer;font:500 12px var(--f-mono);color:var(--ink-2)}
.fx-btn:disabled{opacity:.35;cursor:default}
.fx-btn.warn{color:var(--heat);border-color:var(--heat)}
.editing{font:400 11.5px/1.4 var(--f-mono);color:var(--accent)}
.tl{display:grid;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tl:empty{display:none}
.tl-head{display:flex;align-items:center;gap:8px}
.tl-head input{flex:1;min-width:0;accent-color:var(--accent)}
.tl-play{padding:4px 9px;font-size:12px}
.tl-time{font:400 11px var(--f-mono);color:var(--ink-2);min-width:46px;text-align:right}
.tl-rows{position:relative;display:grid;gap:3px}
.tl-row{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;font:400 10px/1 var(--f-mono);color:var(--ink-2)}
.tl-track{position:relative;height:9px;background:var(--panel-2);border-radius:3px}
.tl-bar{position:absolute;top:0;bottom:0;min-width:3px;border-radius:3px;background:var(--ink-2);opacity:.55}
.tl-bar.on{background:var(--accent);opacity:1}
.tl-head-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--heat);pointer-events:none}
svg .gl{stroke:var(--grid);stroke-width:.03}
svg .gl.m{stroke:var(--line);stroke-width:.04}
svg text{font-family:var(--f-mono);fill:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:border-color .12s}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <h2>Roster</h2>
    <div class="filters" id="filters"></div>
    <div class="roster" id="roster"></div>
    <div class="newrow">
      <div class="seg" role="group" aria-label="Kind of new sheet"><button type="button" id="kindChamp" aria-pressed="true">Champion</button><button type="button" id="kindEnemy" aria-pressed="false">Enemy</button></div>
      <button class="btn" id="newBlank">+ New champion</button>
    </div>
    <button class="btn" id="newKnight">+ Knight example</button>
    <button class="btn" id="boardBtn">Races and board settings</button>
    <button class="btn" id="exportBtn">Export all (.json)</button>
    <button class="btn" id="importBtn">Import (.json)</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn" id="backupBtn" hidden>Download the pre-update backup</button>
    <div class="status" id="status">Loading…</div>
  </aside>
  <main id="main"><div class="empty"><h1>Loading your champions</h1><p>One moment.</p></div></main>
</div>

<script>
(function(){
"use strict";
var SCREEN_W_M = 28;              // visible width of the game's camera, in meters
var TAG_GROUPS = [
  ["Delivery",["projectile","melee","ranged","beam","channel","charge-up","recast","toggle","stance","delayed","homing","returning"]],
  ["Damage",["core","area","cone","single-target","pierce","chain","dot","burst","execute","on-hit","spread"]],
  ["Crowd control",["cc","stun","slow","root","knockback","knock-up","pull","silence","blind","fear","charm","taunt","suppress","sleep","disarm"]],
  ["Movement",["movement","mobility","dash","blink","leap","teleport","speed-up","unstoppable","ghosted"]],
  ["Defense",["defensive","shield","heal","lifesteal","damage-reduction","invulnerable","untargetable","cleanse","stealth","parry","reflect"]],
  ["Utility",["buff","debuff","empower","aura","mark","reveal","summon","trap","zone","wall","terrain","resource-gain","cooldown-reset"]],
  ["Role",["ultimate","generator","companion"]],
  ["World",["wall-slam","grappleable","destructible","bounce","elevated"]]
];
var TAGS = [].concat.apply([], TAG_GROUPS.map(function(g){ return g[1]; }));
var CASTS = {
  skillshot:{group:"Projectiles",label:"Skillshot (line)", uses:["range","width"], w:"Width"},
  charge:{group:"Projectiles",label:"Charge-up skillshot", uses:["range","width"], w:"Width"},
  beam:{group:"Projectiles",label:"Channeled beam", uses:["range","width"], w:"Width"},
  boomerang:{group:"Projectiles",label:"Boomerang (out and back)", uses:["range","width"], w:"Width"},
  fan:{group:"Projectiles",label:"Fan of projectiles", uses:["range","width","angle","count"], w:"Width"},
  chain:{group:"Projectiles",label:"Chain / bounce", uses:["range","width","count"], w:"Bounce range"},
  cone:{group:"Areas",label:"Cone / arc", uses:["range","angle"]},
  ground:{group:"Areas",label:"Ground-targeted area", uses:["range","width"], w:"Radius"},
  vector:{group:"Areas",label:"Placed line (vector)", uses:["range","width","length"], w:"Width"},
  wall:{group:"Areas",label:"Wall / barrier", uses:["range","width","length"], w:"Thickness"},
  ring:{group:"Areas",label:"Ring around you", uses:["width","inner"], w:"Outer radius"},
  self:{group:"Self",label:"Self (aura or buff)", uses:["width"], w:"Radius"},
  orbit:{group:"Self",label:"Orbiting blades", uses:["width","count"], w:"Orbit radius"},
  unit:{group:"Targeted",label:"Unit-targeted", uses:["range"]},
  ally:{group:"Targeted",label:"Ally-targeted", uses:["range"]},
  dash:{group:"Movement",label:"Dash", uses:["range","width"], w:"Width"},
  leap:{group:"Movement",label:"Leap (lands in an area)", uses:["range","width"], w:"Landing radius"},
  blink:{group:"Movement",label:"Blink / teleport", uses:["range"]},
  summon:{group:"Summons",label:"Summon / turret", uses:["range","width"], w:"Unit size"},
  homing:{group:"Projectiles",label:"Homing projectile", uses:["range","width"], w:"Hit size"},
  delayed:{group:"Areas",label:"Delayed strike (marker, then hit)", uses:["range","width"], w:"Radius", dur:"hits after"},
  aura:{group:"Self",label:"Channeled aura (follows you)", uses:["width"], w:"Radius", dur:"channels for"},
  toggle:{group:"Self",label:"Toggle / stance", uses:["width"], w:"Radius", dur:"drain interval"},
  pull:{group:"Targeted",label:"Pull target to you", uses:["range"]},
  trap:{group:"Summons",label:"Trap (placed, triggers later)", uses:["range","width"], w:"Trigger radius", dur:"armed for"},
  recast:{group:"Special",label:"Recast / two-stage", uses:["range","width","length"], w:"Width", dur:"recast window"},
  global:{group:"Special",label:"Global (no range limit)", uses:["width"], w:"Lane width (0 = everyone)"}
};
var EXTRAS = [["length","Length",0.5,15,0.25,"m",4],["inner","Inner radius",0,8,0.25,"m",1],["count","Count",1,12,1,"",3],["duration","Duration",0,20,0.25,"s",0],["speed","Proj. speed",0,40,0.5,"m/s",0],["charges","Charges",1,5,1,"",1]];
var DMG = {physical:"Physical", magic:"Magic", true:"True", none:"No damage"};
var RESOURCES = ["None","Fury","Mana","Energy"];
var ROLES = ["Bruiser","Tank","Marksman","Mage","Assassin","Support","Skirmisher"];

/* ---------- v2 model: kinds, archetypes, races ---------- */
var FORMAT_VERSION = 2;           // export envelope version; the importer accepts 1 and 2
var KEY="champion-kit-board", KEY_BACKUP=KEY+".backup-v1", KEY_RACES=KEY+".races", KEY_SETTINGS=KEY+".settings", KEY_SCHEMA=KEY+".schema", KEY_UI="champion-kit-ui";
var KINDS = {champion:"Champion", enemy:"Enemy"};
var ARCHETYPES = ["Assassin","Mage","Bruiser","Duelist","Skirmisher"];          // shared by champions and enemies (DECISIONS.md, 2026-10-07)
var ENEMY_ARCHETYPES = ["Basic"];                                               // fodder's archetype
var LEGACY_ROLES = ROLES.filter(function(r){ return ARCHETYPES.indexOf(r)<0; }); // Tank, Marksman, Support: still work on saved sheets
var LAYER_PLACEHOLDER = {Assassin:"e.g. the dash-deflect and poise", Skirmisher:"e.g. the rhythm", Duelist:"undecided", Mage:"undecided", Bruiser:"undecided", Basic:"none: fodder has its basic attack only"};
var DEFAULT_HINTS = {
  Assassin:"Fast hits, then out. Deflect and poise are the Assassin's; enemy strings of 3-4 fast hits.",
  Mage:"Ranged spells and zones; enemy strings are 3-shot volleys.",
  Bruiser:"Trades blows up close; enemy strings of 2-3 heavy hits.",
  Duelist:"One-on-one pressure; enemy strings of 4-5 hits, the most pressure.",
  Skirmisher:"Hit and reset; enemy strings of 2-3 fast hits, then reset.",
  Basic:"Fodder: no string, its basic attack only.",
  Tank:"Legacy role from before the archetypes (2026-10-07).", Marksman:"Legacy role from before the archetypes (2026-10-07).", Support:"Legacy role from before the archetypes (2026-10-07)."

// One ability's to-scale preview. A single effect draws exactly as it always has; several effects are drawn in the one
// grid, numbered in order, each with its own dash and opacity, fitted to the area they cover together.
function preview(a){
  var parts=(Array.isArray(a.parts)&&a.parts.length>1)?a.parts:null;
  var x0=Infinity,x1=-Infinity,y1=-Infinity;
  (parts||[a]).forEach(function(p){ var b=castBox(p); x0=Math.min(x0,b.x0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1); });
  var BODY=0.45;
  var bw=x1-x0, y0=-y1, bh=2*y1; if(bh<bw*0.5){ y1=bw*0.25; y0=-y1; bh=2*y1; }
  var svg=s("svg",{viewBox:x0+" "+y0+" "+bw+" "+bh,preserveAspectRatio:"xMidYMid meet",role:"img","aria-label":(parts?parts.length+" effects":CASTS[a.cast].label)+" to scale"});
  var step = Math.max(bw,bh)>26?5:Math.max(bw,bh)>12?2:1;
  for(var gx=Math.ceil(x0/step)*step; gx<=x1; gx+=step) svg.appendChild(s("line",{class:"gl"+(gx===0?" m":""),x1:gx,y1:y0,x2:gx,y2:y1}));
  for(var gy=Math.ceil(y0/step)*step; gy<=y1; gy+=step) svg.appendChild(s("line",{class:"gl"+(gy===0?" m":""),x1:x0,y1:gy,x2:x1,y2:gy}));
  var caps=[], labels=[];
  if(!parts){
    caps.push(drawCast(function(e){ svg.appendChild(e); },a,colorFor(a)));
  }else{
    var fs=Math.max(bw,bh)*0.04, placed=[];
    parts.forEach(function(p,i){
      var look=PART_LOOK[i]||PART_LOOK[PART_LOOK.length-1];
      var g=s("g",{"data-part":i,style:"opacity:"+look.op+(look.dash?";stroke-dasharray:"+look.dash:"")});
      caps.push(drawCast(function(e){ g.appendChild(e); },p,colorFor({cast:p.cast,dmg:a.dmg})));
      svg.appendChild(g);
      var an=castAnchor(p), ax=an[0], ay=an[1];
      for(var t=0;t<8&&placed.some(function(q){ return Math.abs(q[0]-ax)<fs*2&&Math.abs(q[1]-ay)<fs*2; });t++) ax+=fs*2.2;
      ax=Math.min(Math.max(ax,x0+fs*1.2),x1-fs*1.2); ay=Math.min(Math.max(ay,y0+bh*0.2),y1-bh*0.15); placed.push([ax,ay]);
      var lg=s("g",{"data-label":i});
      lg.appendChild(s("circle",{cx:ax,cy:ay,r:fs,style:"fill:var(--ink);stroke:var(--panel-2);stroke-width:"+(fs*0.18)}));
      var tx=s("text",{x:ax,y:ay,"text-anchor":"middle","dominant-baseline":"central",style:"font-size:"+(fs*1.25)+"px;font-weight:600;fill:var(--bg)"}); tx.textContent=String(i+1);
      lg.appendChild(tx); labels.push(lg);
    });
  }
  svg.appendChild(s("circle",{cx:0,cy:0,r:BODY,style:"fill:var(--ink)"}));
  svg.appendChild(s("path",{d:"M"+(BODY-.02)+" 0 l.28 -.2 v.4 z",style:"fill:var(--ink)"}));
  labels.forEach(function(lg){ svg.appendChild(lg); });
  var wrap=document.createElement("div"); wrap.appendChild(svg);
  wrap.appendChild(el("span",{class:"cap tl",text:parts?parts.length+" effects, numbered in the order they start":caps[0]}));
  wrap.appendChild(el("span",{class:"cap",text:"grid = "+step+" m"}));
  wrap.appendChild(el("span",{class:"cap r",text:"champion faces right"}));
  wrap.caps=caps;
  return wrap;
}

function del(){

/* ---------- brief ---------- */
function makeBrief(c){
  var L=[], isE=c.kind==="enemy";
  L.push("# "+(c.name||"Unnamed")+" ("+(isE?"enemy, "+c.archetype:c.archetype+", resource: "+c.resource)+")");
  var who=[]; if(raceLabel(c)) who.push("Race: "+raceLabel(c)+(function(){ var r=raceById(c.race); return r?" ("+r.size+"; "+[r.silhouette,r.identity].filter(Boolean).join("; ")+")":""; })());
  if(isE&&c.faction) who.push("Faction: "+c.faction);
  if(who.length) L.push(who.join(". ")+".");
  if(c.archetype_layer) L.push("Archetype layer: "+c.archetype_layer);
  if(c.fantasy) L.push((isE?"What it is: ":"Fantasy: ")+c.fantasy);
  var p=c.passive; L.push("","Passive"+(p.name?" - "+p.name:"")+": "+(p.desc||"(not written)")+(p.tags.length?" Tags: "+p.tags.join(", ")+".":""));
  c.abilities.forEach(function(a){ abilityBrief(L,a); });

// The cast and size words for one effect (an ability's top-level fields are its first effect).
function sizeWords(p){
  var def=CASTS[p.cast], u=def.uses, parts=[def.label];
  if(u.indexOf("range")>=0) parts.push(fmt(p.range,2)+" m ("+Math.round(p.range*100)+" u) range");
  if(u.indexOf("width")>=0) parts.push(fmt(p.width,2)+" m "+(def.w||"width").toLowerCase());
  if(u.indexOf("angle")>=0) parts.push(p.angle+" degree arc");
  if(u.indexOf("length")>=0) parts.push(fmt(p.length||0,2)+" m long");
  if(u.indexOf("inner")>=0) parts.push(fmt(p.inner||0,2)+" m inner radius");
  if(u.indexOf("count")>=0) parts.push((p.count||1)+(p.cast==="chain"?" bounces":p.cast==="orbit"?" blades":" projectiles"));

       : p.trigger==="on_hit"?(d?d+"after the previous hits":"when the previous hits")
       : p.trigger==="on_recast"?"on recast"+(d?" (about "+d.trim()+" after the previous starts)":"")
       : (d?d+"after the previous ends":"when the previous ends");
}
function abilityBrief(L,a){
  var def=CASTS[a.cast], parts=sizeWords(a);
  if(a.speed>0) parts.push(fmt(a.speed,1)+" m/s projectile speed");
  if(a.duration>0) parts.push((def.dur||"lasts")+" "+fmt(a.duration,1)+" s");
  parts.push(fmt(a.castTime,2)+" s cast", fmt(a.cooldown,1)+" s cooldown"); if(a.charges>1) parts.push(a.charges+" charges"); if(a.cost) parts.push("cost "+a.cost); parts.push(DMG[a.dmg].toLowerCase());
  L.push("",a.slot+(a.name?" - "+a.name:"")+": "+parts.join(", ")+"."+(a.tags.length?" Tags: "+a.tags.join(", ")+".":""),(a.desc||"(not written)"));
  if(Array.isArray(a.parts)&&a.parts.length>1){
    var times=timeline(a);
    L.push("Effects in order (one graphic, layered): "+a.parts.map(function(p,i){
      var w=sizeWords(p), pd=CASTS[p.cast]; if(i>0&&p.duration>0) w.push((pd.dur||"lasts")+" "+fmt(p.duration,1)+" s");
      return (i+1)+") "+(i===0?"after the cast":triggerWords(p))+" (at "+fmt(times[i].start,2)+" s): "+w.join(", ");
    }).join("; ")+".");
  }
}
function copyBrief(){
  var t=makeBrief(cur()); var note=function(m){ var n=document.getElementById("copyNote"); if(n) n.textContent=m; };
  try{ navigator.clipboard.writeText(t).then(function(){ note("Copied. Paste it to Claude or the builder."); },function(){ sel(); }); }catch(e){ sel(); }
  function sel(){ var ta=document.querySelector(".brief textarea"); if(ta){ ta.focus(); ta.select(); } note("Select all and copy this text (your browser blocked the copy button)."); }
}

/* ---------- boot ---------- */
document.getElementById("newBlank").addEventListener("click",function(){ addBlank(ui.newKind); });
document.getElementById("newKnight").addEventListener("click",addKnight);
document.getElementById("kindChamp").addEventListener("click",function(){ setNewKind("champion"); });
document.getElementById("kindEnemy").addEventListener("click",function(){ setNewKind("enemy"); });
document.getElementById("boardBtn").addEventListener("click",function(){ state.view=state.view==="board"?"doc":"board"; state.raceDel=null; renderMain(); });
document.getElementById("backupBtn").addEventListener("click",downloadBackup);

function adopt(){ var last=recallCurrent(); var ids=Object.keys(state.champs); if(!state.current || !state.champs[state.current]) state.current=(last&&state.champs[last])?last:(ids.length?ids.sort()[0]:null); renderRoster(); renderMain(); }

async function boot(){
  loadBoard(); setNewKind(ui.newKind); renderFilters();
  var db=null,user=null;
  try{ if(window.claude&&window.claude.use){ db=await window.claude.use("db"); user=await window.claude.use("user"); } }catch(e){}
  if(user&&user.can){ try{ var w=await user.can("data.write"); if(w===false) state.canWrite=false; }catch(e){} }
  if(db){
    state.db=db; state.mode="db"; setStatus("Connected. Changes save automatically.");
    var first=true;
    db.collection("champions").onSnapshot(function(snap){
      var seen={};
      snap.docs.forEach(function(d){ var data=d.data(); if(!data) return; seen[d.id]=1; if(state.gone[d.id]) return;
        var json=JSON.stringify(data);
        var isCur = d.id===state.current;
        if((state.dirty||state.saving) && d.id===state.dirtyId) return;   // keep local edits
        if(state.lastJson[d.id]===json && state.champs[d.id]) return; // echo of our own write
        state.lastJson[d.id]=json; state.champs[d.id]=upgrade(data);
        if(isCur && !first) { renderMain(); }
      });
      Object.keys(state.gone).forEach(function(id){ if(!seen[id]) delete state.gone[id]; });
      Object.keys(state.champs).forEach(function(id){ if(!seen[id] && state.lastJson[id]!==undefined){ delete state.champs[id]; delete state.lastJson[id]; } });
      var wasFirst=first; first=false;
      if(wasFirst||!state.current||!state.champs[state.current]) adopt(); else renderRoster();
    },function(){ setStatus("Lost connection to saved champions.",true); });
  }else{
    backupOnce();
    state.mode="local"; state.champs=lsGet(); setStatus("Saved in this browser only. Use Export to back up.",true); renderFilters(); adopt();
    document.getElementById("backupBtn").hidden=!hasBackup();
  }
  if(!state.canWrite){ document.getElementById("newBlank").disabled=true; document.getElementById("newKnight").disabled=true; setStatus("View only. Saved champions update live."); }
}
/* ---------- standalone: export / import ---------- */
function download(payload,name){
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function exportAll(){
  flush();
  download({format:"champion-kit-board",version:FORMAT_VERSION,exported:new Date().toISOString(),champions:state.champs,races:board.races,settings:board.settings},
    "champions-"+new Date().toISOString().slice(0,10)+".json");
  setStatus("Exported "+Object.keys(state.champs).length+" sheet(s) and "+board.races.length+" race(s). Check your Downloads folder.",true);
}
function downloadBackup(){
  var raw=null; try{ raw=localStorage.getItem(KEY_BACKUP); }catch(e){}
  if(raw===null){ setStatus("No backup in this browser.",true); return; }
  var champs={}; try{ champs=JSON.parse(raw)||{}; }catch(e){ champs={}; }
  download({format:"champion-kit-board",version:1,exported:new Date().toISOString(),champions:champs},"champions-before-update.json");
  setStatus("Downloaded the copy of your sheets from before this update. Import it any time.",true);
}
// Import compare: both sides get the same back-filled defaults first, so an old sheet and its re-imported copy are identical.
function norm(c){
  var o=upgrade(JSON.parse(JSON.stringify(c)));
  function sort(v){ if(Array.isArray(v)) return v.map(sort); if(v&&typeof v==="object"){ var r={}; Object.keys(v).sort().forEach(function(k){ r[k]=sort(v[k]); }); return r; } return v; }
  return JSON.stringify(sort(o));
}
function importBoard(data){
  var res={races:0,kept:0};
  if(data && Array.isArray(data.races)){
    data.races.forEach(function(r){
      if(!r||typeof r!=="object"||typeof r.id!=="string"||!r.id) return;
      var mine=raceById(r.id); r=upgradeRace(JSON.parse(JSON.stringify(r)));
      if(!mine){ board.races.push(r); res.races++; }
      else if(JSON.stringify(mine)!==JSON.stringify(r)) res.kept++;   // same id, different text: yours is kept
    });
    if(res.races) saveRaces();
  }
  if(data && data.settings && typeof data.settings==="object"){
    var theirs=normSettings(JSON.parse(JSON.stringify(data.settings))), changed=false;
    Object.keys(theirs.archetype_hints).forEach(function(k){   // a hint you never edited takes theirs
      if(board.settings.archetype_hints[k]===DEFAULT_HINTS[k] && theirs.archetype_hints[k]!==DEFAULT_HINTS[k]){ board.settings.archetype_hints[k]=theirs.archetype_hints[k]; changed=true; } });
    if(changed) saveSettings();
  }
  return res;
}
function importFile(file){
  var rd=new FileReader();
  rd.onload=function(){
    var data; try{ data=JSON.parse(rd.result); }catch(e){ setStatus("That file is not valid JSON. Nothing imported.",true); return; }
    var newer = data && data.format==="champion-kit-board" && typeof data.version==="number" && data.version>FORMAT_VERSION;
    var list = data && data.champions ? data.champions : data;
    var items = Array.isArray(list) ? list : (list && typeof list==="object" ? (list.abilities&&list.passive ? [list] : Object.keys(list).map(function(k){ return list[k]; })) : []);
    items=items.filter(function(c){ return c && typeof c==="object" && Array.isArray(c.abilities) && c.passive; });
    var rb=importBoard(data);
    if(!items.length && !rb.races){ setStatus("No champions found in that file. Nothing imported.",true); return; }
    var added=0,copies=0;
    items.forEach(function(c){
      if(typeof c.id!=="string"||!c.id) c.id=uid();
      if(state.champs[c.id]){
        if(norm(state.champs[c.id])===norm(c)) return;                          // identical, skip
        c.id=uid(); c.name=(c.name||"Champion")+" (imported)"; copies++;       // never overwrite yours
      }
      c.updated=c.updated||Date.now(); state.champs[c.id]=upgrade(c); added++;
    });
    lsSet();
    var ids=Object.keys(state.champs); if(!state.current||!state.champs[state.current]) state.current=ids[0];
    renderFilters(); renderRoster(); renderMain();
    setStatus("Imported "+added+" sheet(s)"+(copies?" ("+copies+" renamed so nothing was overwritten)":"")+(rb.races?", "+rb.races+" new race(s)":"")+(rb.kept?" ("+rb.kept+" race(s) kept as yours)":"")+"."+(newer?" The file came from a newer board; fields this board does not know were kept but are not shown.":""),true);
  };
  rd.readAsText(file);
}
document.getElementById("exportBtn").addEventListener("click",exportAll);
document.getElementById("importBtn").addEventListener("click",function(){ document.getElementById("importFile").click(); });
document.getElementById("importFile").addEventListener("change",function(e){ var f=e.target.files&&e.target.files[0]; if(f) importFile(f); e.target.value=""; });

boot();
})();
